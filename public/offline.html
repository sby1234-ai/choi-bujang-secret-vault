<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>내 자료실 | 오프라인</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 640px; margin: 0 auto; padding: 56px 22px; }
    h1 { font-size: 28px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    button { padding: 11px 14px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>인터넷에 연결되지 않아 자료실을 열 수 없습니다. 메모와 로그인 정보는 이 기기에 따로 저장해 두지 않으므로, 오프라인에서는 메모를 보거나 고칠 수 없습니다.</p>
    <p>연결이 돌아오면 아래 단추를 눌러 다시 열어 주세요. 다시 열면 서버가 로그인과 기기 승인 상태를 처음부터 다시 확인합니다.</p>
    <button type="button" onclick="location.replace('/')">다시 열기</button>
  </main>
</body>
</html>
