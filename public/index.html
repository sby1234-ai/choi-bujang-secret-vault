<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth { margin: 26px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth h2 { margin: 0 0 12px; font-size: 18px; }
    .auth form { display: grid; gap: 10px; }
    .auth label { display: grid; gap: 6px; font-size: 14px; color: #bfd0e5; }
    .auth input { padding: 11px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; }
    .auth button { padding: 11px 14px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 16px; font-weight: 700; cursor: pointer; }
    .auth button:disabled { opacity: .6; cursor: wait; }
    .auth .signed-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .auth .signed-in span { color: #bfd0e5; overflow-wrap: anywhere; }
    .auth-error { margin: 10px 0 0; padding: 10px 12px; border: 1px solid #d07384; border-radius: 10px; color: #ffe3e8; background: #612a3544; font-size: 15px; }
    .composer { margin: 18px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .composer h2 { margin: 0 0 12px; font-size: 18px; }
    .composer form, .note-edit { display: grid; gap: 10px; }
    .composer label, .note-edit label { display: grid; gap: 6px; font-size: 14px; color: #bfd0e5; }
    .composer input, .composer textarea, .note-edit input, .note-edit textarea { padding: 11px 12px; border: 1px solid #51667c; border-radius: 10px; background: #101a28; color: #ecf4ff; font-size: 16px; font-family: inherit; }
    .composer textarea, .note-edit textarea { min-height: 84px; resize: vertical; }
    .composer button, .note-actions button, .note-edit button { padding: 9px 14px; border: 0; border-radius: 10px; background: #8ad8df; color: #101a28; font-size: 15px; font-weight: 700; cursor: pointer; }
    .note-actions button.secondary, .note-edit button.secondary { background: #2d4259; color: #ecf4ff; }
    .note-actions button.danger { background: #d07384; color: #101a28; }
    .composer button:disabled, .note-actions button:disabled, .note-edit button:disabled { opacity: .6; cursor: wait; }
    .note-actions, .note-edit .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    li .note-body { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
    .notes-error { margin: 0 0 12px; padding: 10px 12px; border: 1px solid #d07384; border-radius: 10px; color: #ffe3e8; background: #612a3544; font-size: 15px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 한곳으로</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>

    <section class="auth" aria-live="polite">
      <h2 id="auth-title">로그인</h2>
      <form id="login-form">
        <label>이메일
          <input id="email" type="email" autocomplete="email" required>
        </label>
        <label>비밀번호
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <div id="signed-in" class="signed-in" hidden>
        <span id="signed-in-text"></span>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p id="auth-error" class="auth-error" role="alert" hidden></p>
    </section>

    <div class="notice">로그인과 메모 요청은 모두 서버 함수 한 곳을 거치고, 이 화면에는 저장소에 직접 접속하는 키가 없습니다. 서버가 로그인 토큰과 메모의 소유자를 매번 확인해서, 내 메모만 보고 고칠 수 있고 다른 사람의 메모는 읽거나 고치거나 지울 수 없습니다.</div>

    <section class="composer" id="composer" hidden>
      <h2>새 가상 메모</h2>
      <form id="note-form">
        <label>제목
          <input id="note-title" type="text" maxlength="100" required>
        </label>
        <label>내용
          <textarea id="note-body" maxlength="2000"></textarea>
        </label>
        <button id="note-add" type="submit">메모 추가</button>
      </form>
    </section>
    <p id="notes-error" class="notes-error" role="alert" hidden></p>
    <ul id="notes" aria-live="polite"><li>로그인 상태를 확인하는 중입니다.</li></ul>
  </main>
  <script type="module">
    // 이 화면에는 저장소 주소·키가 없습니다. 로그인과 메모 요청은 모두 같은 사이트의 /api/... 서버 함수로만 보냅니다.
    const SESSION_KEY = 'byteback-session';
    let session = null; // { access_token, refresh_token, expires_at, email }

    const form = document.querySelector('#login-form');
    const emailInput = document.querySelector('#email');
    const passwordInput = document.querySelector('#password');
    const loginButton = document.querySelector('#login-button');
    const signedIn = document.querySelector('#signed-in');
    const signedInText = document.querySelector('#signed-in-text');
    const logoutButton = document.querySelector('#logout-button');
    const authTitle = document.querySelector('#auth-title');
    const authError = document.querySelector('#auth-error');

    function showError(message) {
      authError.textContent = message;
      authError.hidden = !message;
    }

    function reasonFor(code) {
      const reasons = {
        INVALID_LOGIN: '이메일 또는 비밀번호가 맞지 않습니다.',
        EMAIL_NOT_CONFIRMED: '이메일 확인이 끝나지 않은 계정입니다.',
        RATE_LIMITED: '요청이 너무 많습니다. 잠시 뒤에 다시 시도해 주세요.',
        USER_BANNED: '이용이 제한된 계정입니다.',
        SERVER_NOT_CONFIGURED: '서버 설정이 끝나지 않았습니다.',
        AUTH_UNAVAILABLE: '로그인 서버에 연결하지 못했습니다. 잠시 뒤에 다시 시도해 주세요.',
      };
      return reasons[code] ?? '로그인에 실패했습니다.';
    }

    // 세션은 이 브라우저에만 저장합니다. 저장소를 못 쓰는 환경에서도 화면은 동작합니다.
    function readStored() {
      try {
        const saved = JSON.parse(localStorage.getItem(SESSION_KEY));
        if (saved && typeof saved.access_token === 'string' && typeof saved.refresh_token === 'string') return saved;
      } catch { /* 저장된 세션이 없거나 읽을 수 없으면 로그아웃 상태입니다. */ }
      return null;
    }

    function setSession(next) {
      session = next;
      try {
        if (next) localStorage.setItem(SESSION_KEY, JSON.stringify(next));
        else localStorage.removeItem(SESSION_KEY);
      } catch { /* 저장 실패는 무시합니다. */ }
    }

    function render() {
      const loggedIn = Boolean(session);
      form.hidden = loggedIn;
      signedIn.hidden = !loggedIn;
      authTitle.textContent = loggedIn ? '로그인됨' : '로그인';
      signedInText.textContent = loggedIn ? `${session.email ?? '알 수 없는 계정'} 계정으로 로그인했습니다.` : '';
    }

    async function postJson(path, payload, token) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers.Authorization = `Bearer ${token}`;
      return fetch(path, { method: 'POST', headers, cache: 'no-store', body: JSON.stringify(payload ?? {}) });
    }

    // 만료가 가까우면 서버 함수로 토큰을 새로 받습니다. 한 번에 한 요청만 보냅니다.
    let refreshing = null;
    function refreshSession() {
      refreshing ??= (async () => {
        try {
          const response = await postJson('/api/refresh', { refresh_token: session?.refresh_token });
          if (response.ok) setSession(await response.json());
          else if (response.status === 401) setSession(null);
        } catch { /* 네트워크 오류면 지금 세션을 그대로 둡니다. */ }
        return session;
      })().finally(() => { refreshing = null; });
      return refreshing;
    }

    async function currentSession() {
      if (!session) return null;
      if (session.expires_at - Date.now() / 1000 > 60) return session;
      return refreshSession();
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      showError('');
      loginButton.disabled = true;
      try {
        const response = await postJson('/api/login', { email: emailInput.value.trim(), password: passwordInput.value });
        if (response.ok) {
          setSession(await response.json());
          render();
          await loadNotes();
        } else {
          let code = null;
          try { code = (await response.json()).error; } catch { /* 본문이 없으면 일반 문구를 보여 줍니다. */ }
          showError(reasonFor(code));
        }
      } catch {
        showError('로그인 서버에 연결하지 못했습니다. 네트워크를 확인해 주세요.');
      } finally {
        passwordInput.value = '';
        loginButton.disabled = false;
      }
    });

    logoutButton.addEventListener('click', async () => {
      showError('');
      logoutButton.disabled = true;
      const token = session?.access_token;
      try {
        if (token) await postJson('/api/logout', {}, token);
      } catch { /* 서버에 닿지 못해도 이 브라우저의 세션은 지웁니다. */ }
      setSession(null);
      render();
      await loadNotes();
      logoutButton.disabled = false;
    });

    const list = document.querySelector('#notes');
    const composer = document.querySelector('#composer');
    const noteForm = document.querySelector('#note-form');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteAdd = document.querySelector('#note-add');
    const notesError = document.querySelector('#notes-error');
    let loadId = 0;

    function showNotesError(message) {
      notesError.textContent = message;
      notesError.hidden = !message;
    }

    function showMessage(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }

    // 로그인 토큰은 Authorization 헤더로만 보냅니다. 401이면 한 번 갱신해 보고 다시 보냅니다.
    async function api(method, path, payload) {
      let current = await currentSession();
      if (!current) throw new Error('로그인이 필요합니다.');
      const send = (token) => {
        const headers = { Authorization: `Bearer ${token}` };
        if (payload !== undefined) headers['Content-Type'] = 'application/json';
        return fetch(path, {
          method, headers, cache: 'no-store',
          body: payload === undefined ? undefined : JSON.stringify(payload),
        });
      };
      let response = await send(current.access_token);
      if (response.status === 401) {
        current = await refreshSession();
        if (current) response = await send(current.access_token);
      }
      if (response.status === 401) {
        setSession(null);
        render();
        throw new Error('로그인이 확인되지 않았습니다. 다시 로그인해 주세요.');
      }
      if (response.status === 404) throw new Error('메모를 찾을 수 없습니다.');
      if (response.status === 400) throw new Error('입력을 확인해 주세요. 제목은 1~100자, 내용은 2000자 이하여야 합니다.');
      if (!response.ok) throw new Error('서버 요청에 실패했습니다.');
      return response.status === 204 ? null : response.json();
    }

    function button(label, className, onClick) {
      const el = document.createElement('button');
      el.type = 'button';
      el.textContent = label;
      if (className) el.className = className;
      el.addEventListener('click', onClick);
      return el;
    }

    function noteItem(note) {
      const item = document.createElement('li');
      const title = document.createElement('strong');
      const body = document.createElement('span');
      body.className = 'note-body';
      title.textContent = note.title;
      body.textContent = note.body;
      const actions = document.createElement('div');
      actions.className = 'note-actions';
      actions.append(
        button('수정', 'secondary', () => item.replaceWith(editItem(note))),
        button('삭제', 'danger', async (event) => {
          event.currentTarget.disabled = true;
          showNotesError('');
          try {
            await api('DELETE', `/api/notes/${note.id}`);
            await loadNotes();
          } catch (error) {
            showNotesError(error.message);
            event.currentTarget.disabled = false;
          }
        }),
      );
      item.append(title, body, actions);
      return item;
    }

    function editItem(note) {
      const item = document.createElement('li');
      const form = document.createElement('form');
      form.className = 'note-edit';
      const titleLabel = document.createElement('label');
      titleLabel.textContent = '제목';
      const titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.maxLength = 100;
      titleInput.required = true;
      titleInput.value = note.title;
      titleLabel.append(titleInput);
      const bodyLabel = document.createElement('label');
      bodyLabel.textContent = '내용';
      const bodyInput = document.createElement('textarea');
      bodyInput.maxLength = 2000;
      bodyInput.value = note.body;
      bodyLabel.append(bodyInput);
      const row = document.createElement('div');
      row.className = 'row';
      const save = document.createElement('button');
      save.type = 'submit';
      save.textContent = '저장';
      row.append(save, button('취소', 'secondary', () => item.replaceWith(noteItem(note))));
      form.append(titleLabel, bodyLabel, row);
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        save.disabled = true;
        showNotesError('');
        try {
          await api('PUT', `/api/notes/${note.id}`, { title: titleInput.value, body: bodyInput.value });
          await loadNotes();
        } catch (error) {
          showNotesError(error.message);
          save.disabled = false;
        }
      });
      item.append(form);
      return item;
    }

    async function loadNotes() {
      const mine = ++loadId;
      composer.hidden = !session;
      if (!session) {
        showNotesError('');
        showMessage('로그인하면 가상 메모를 볼 수 있습니다.');
        return;
      }
      try {
        const notes = await api('GET', '/api/notes');
        if (mine !== loadId) return;
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) {
          showMessage('내 메모가 없습니다. 위에서 추가해 보세요.');
          return;
        }
        list.replaceChildren(...notes.map(noteItem));
      } catch (error) {
        if (mine === loadId) {
          composer.hidden = !session;
          showMessage(error.message);
        }
      }
    }

    noteForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      noteAdd.disabled = true;
      showNotesError('');
      try {
        await api('POST', '/api/notes', { title: noteTitle.value, body: noteBody.value });
        noteTitle.value = '';
        noteBody.value = '';
        await loadNotes();
      } catch (error) {
        showNotesError(error.message);
      } finally {
        noteAdd.disabled = false;
      }
    });

    // 다른 탭에서 로그인·로그아웃하면 이 탭도 따라갑니다.
    window.addEventListener('storage', (event) => {
      if (event.key !== SESSION_KEY) return;
      session = readStored();
      render();
      loadNotes();
    });

    session = readStored();
    render();
    await loadNotes();
  </script>
</body>
</html>
